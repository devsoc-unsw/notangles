# This should will be redone when the server is ready to replace the old one
# Currently it uses different names and ports to avoid conflicts with the old server
services:
  database-new:
    container_name: notangles-database-new
    hostname: notangles_database_new
    restart: always
    image: postgres:17-alpine
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - notangles_network_new

  minio:
    container_name: notangles-images
    hostname: notangles_usr_images
    restart: always # Is this necessary for pfps?
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    command: server /data --console-address ":9001"
    networks:
      - notangles_usr_images

volumes:
  postgres:
    name: server-new
  minio:
    name: usr-images

networks:
  notangles_network_new:
    driver: bridge
  notangles_usr_images:
    driver: bridge
