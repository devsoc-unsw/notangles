name: Docker
on:
  push:
    branches:
      - dev
      - staging

permissions: {}

env:
  IMAGE_NAME: ${{ github.ref_name == 'dev' && 'notangles' || 'notangles-staging' }}

jobs:
  build-client:
    name: 'Build (Client)'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-build-client-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'dev' && 'Production' || 'staging' }}
    permissions:
      contents: read
      packages: write # Required to publish container tags to GHCR.
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: client
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
          platforms: linux/amd64
          file: client/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CLARITY_PROJECT_ID=${{ secrets.CLARITY_PROJECT_ID }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-client:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-client:latest
  build-backend:
    name: 'Build (Backend)'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-build-backend-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Required to publish container tags to GHCR.
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
          platforms: linux/amd64
          file: server/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-backend:latest
  build-auto-timetabler-server:
    name: 'Build (Auto Timetabler Server)'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-build-auto-timetabler-server-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Required to publish container tags to GHCR.
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: auto_server
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
          platforms: linux/amd64
          file: auto_server/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-auto-timetabler-server:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-auto-timetabler-server:latest
  repo_dispatch:
    name: Notify deployment repo
    runs-on: ubuntu-latest
    needs: [build-client, build-backend, build-auto-timetabler-server]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
    concurrency:
      group: docker-repo-dispatch-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    permissions: {}
    environment: production

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.IMAGE_UPDATER_APP_ID }}
          private-key: ${{ secrets.IMAGE_UPDATER_APP_PRIVATE_KEY }}
          owner: devsoc-unsw
          repositories: deployment
          permission-actions: write

      - name: Send workflow_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          updates_json="$(
            jq -cn \
              --arg sha "${GITHUB_SHA}" \
              '[
                {image: "ghcr.io/devsoc-unsw/notangles-client", tag: $sha},
                {image: "ghcr.io/devsoc-unsw/notangles-backend", tag: $sha},
                {image: "ghcr.io/devsoc-unsw/notangles-auto-timetabler-server", tag: $sha}
              ]'
          )"
          payload_json="$(
            jq -cn \
              --arg ref "dev" \
              --arg updates "${updates_json}" \
              '{ref: $ref, inputs: {updates: $updates}}'
          )"

          curl --fail-with-body \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/devsoc-unsw/deployment/actions/workflows/dispatch-image-update.yml/dispatches \
            -d "${payload_json}"
