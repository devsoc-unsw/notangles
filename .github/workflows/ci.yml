name: CI
on:
  push: {}

jobs:
  build:
    name: 'Build (${{ matrix.component }})'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [client, server]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm
        with:
          package_json_file: ${{ matrix.component }}/package.json
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ${{ matrix.component }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.component }}

      - name: Generate Prisma Types from Schema
        run: npx prisma generate
        if: ${{ matrix.component == 'server' }}
        working-directory: server

      - name: Build
        run: pnpm run build
        working-directory: ${{ matrix.component }}

  check-auto-tt-deps:
    name: 'Check Dependencies (auto-timetabler-server)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.4'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: auto_server
